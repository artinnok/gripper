[project]
name = "galloc"
version = "0.1.0"
description = "GPU instances with a TTL, managed from a local CLI."
readme = "README.md"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "click>=8.5.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
galloc = "galloc.main:cli"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
